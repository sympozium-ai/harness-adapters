name: Publish Pi adapter

on:
  push:
    branches: [main]
    paths:
      - adapters/pi/**
      - .github/workflows/publish-pi.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: adapters/pi
          push: true
          platforms: linux/amd64
          tags: ghcr.io/sympozium-ai/harness-adapters/pi:sha-${{ github.sha }}
