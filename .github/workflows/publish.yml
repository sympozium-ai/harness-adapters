name: build and publish adapters

on:
  push:
    branches: [main]
    paths:
      - adapters/**
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        adapter: [pi, hermes]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.adapter }}
          tags: |
            type=sha,prefix=
      - name: Build and exercise the contract failure path
        run: |
          if [ "${{ matrix.adapter }}" = hermes ]; then
            ./test/hermes-session-smoke.sh
          fi
          docker build --load -t adapter-smoke:${{ matrix.adapter }} adapters/${{ matrix.adapter }}
          ./test/contract-smoke.sh ${{ matrix.adapter }} adapter-smoke:${{ matrix.adapter }}
      - uses: docker/build-push-action@v6
        with:
          context: adapters/${{ matrix.adapter }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
